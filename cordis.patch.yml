# dsh-tui-app is an ordinary out-of-tree app bundle layered over dsh-base.
# Startup owns this app's command-line grammar; the runner mounts only after
# startup publishes a successful parse result.
- id: hmr
  disabled: true

# Agent Teams replaces direct continuable-subagent controls with the official
# durable roster, mailbox, and shared task board. Workflow's fresh children and
# the underlying providers remain available to the Team runtime.
- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- insert:
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
      config:
        maxMembers: 8
        maxTasks: 256
        maxPendingMessagesPerMember: 64
        maxMessageBytes: 65536
        disposalTimeoutMs: 5000

    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'
      config:
        freshProvider: spawn
        forkProvider: fork

    # Backfill image serialization only when the active DeepSeek adapter does
    # not already advertise native image input. Must mount after llm-deepseek.
    - id: llm-vision
      name: 'dsh-tui-app/llm-vision'

    # Model-facing ask_user_question tool, mounted BEFORE tui-runner so the
    # runner's loader.await() (src/index.ts) sees it registered before the
    # agent is created; a profile-patch placement races the agent's tool
    # snapshot and the tool silently never appears. The QuestionCard renderer
    # in src/ui/app.tsx answers through the user-questions service it injects.
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'

    - id: tui-startup
      name: 'dsh-tui-app/startup'

    - id: tui-runner
      name: 'dsh-tui-app'
      inject: [tuiStartup]
      config:
        resume: !!js ctx.tuiStartup.resume
        theme: !!js ctx.tuiStartup.theme
        color: !!js ctx.tuiStartup.color
